name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Flashcards

jobs:
  format:
    name: swift-format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Formatting is settled by a tool, not by review. --strict makes lint warnings fail the job.
      - name: Lint
        run: |
          xcrun swift-format lint \
            --recursive --strict \
            --configuration .swift-format \
            Flashcards FlashcardsTests

  build-and-test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # Neither the device model nor the runtime is pinned. The iOS 26 floor is enforced by the
      # project's deployment target (ADR 0006), so naming a simulator here would add a second thing
      # to keep in step with the runner image for no extra safety.
      #
      # It is resolved to a UDID rather than passed to xcodebuild as `name=…,OS=latest` because
      # xcodebuild resolves a name against CoreSimulator, which on a cold runner can still be
      # enumerating devices: it then spends its silent 60s destination timeout and dies with exit 70,
      # listing only placeholder destinations. That took out a run on PR #4 and passed on re-run
      # untouched. Polling simctl ourselves turns that race into a wait, and an `id=` destination
      # cannot be mis-resolved.
      - name: Select a simulator
        run: |
          UDID=""
          for attempt in $(seq 1 12); do
            UDID=$(xcrun simctl list devices available --json | jq -r '
              [ .devices
                | to_entries[]
                | select(.key | test("SimRuntime.iOS-"))
                | .value[]
                | select(.name | startswith("iPhone")) ]
              | first | .udid // empty')
            if [ -n "$UDID" ]; then
              break
            fi
            echo "No iPhone simulator available yet (attempt $attempt); waiting."
            sleep 5
          done
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator became available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          # Deliberately not booted here: xcodebuild boots an `id=` device itself as part of
          # testing, and pre-booting it measured as ~2min of pure overhead with no matching
          # saving in the test step.
          echo "Using $(xcrun simctl list devices | grep "$UDID")"
          echo "DESTINATION=id=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Flashcards.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
